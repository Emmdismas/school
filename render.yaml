services:
  - type: web
    name: schoolapp-fullstack
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        value: base64:txJRz6ls+WH5voD3wK++MLVx7/4oX4t6JqYOewd1HPs=
      - key: APP_URL
        value: https://school-xo1a.onrender.com
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        value: <your_db_host>
      - key: DB_PORT
        value: 3306
      - key: DB_DATABASE
        value: <your_db_name>
      - key: DB_USERNAME
        value: <your_db_user>
      - key: DB_PASSWORD
        value: <your_db_password>

      # Optional for WhatsApp bot
      - key: WHATSAPP_API_KEY
        value: <your_whatsapp_api_key>
      - key: BOT_WEBHOOK_URL
        value: <your_webhook_url>
